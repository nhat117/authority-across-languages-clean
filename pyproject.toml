[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "authority-across-languages"
version = "0.1.0"
description = "Offline measurement and analysis of multilingual authority-based prompt injection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai2ai_guard", "src/ai2ai_injection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/ai2ai_guard/review_*.py" = ["E501"]
"src/ai2ai_guard/round3_*.py" = ["E501"]
"src/ai2ai_guard/llm_judge.py" = ["E501"]
"src/ai2ai_guard/sampled_judge.py" = ["E501"]
