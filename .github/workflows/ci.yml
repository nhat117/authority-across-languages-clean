name: Offline analysis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev pytest
      - run: uv run --frozen --extra dev python scripts/analyze.py --output artifacts/analysis.json
